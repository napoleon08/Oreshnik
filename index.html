<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ORBITAL STRIKE — Space Battle</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    overflow: hidden;
    background: #02040a;
    font-family: Arial, sans-serif;
    color: white;
}

canvas {
    display: block;
    background: radial-gradient(circle at center, #101a2e, #02040a 75%);
}

#hud {
    position: fixed;
    top: 20px;
    left: 20px;
    z-index: 10;
    padding: 15px 20px;
    background: rgba(0, 10, 25, 0.72);
    border: 1px solid rgba(120,180,255,.4);
    border-radius: 12px;
    backdrop-filter: blur(8px);
    box-shadow: 0 0 25px rgba(0,120,255,.15);
}

#hud h1 {
    font-size: 20px;
    letter-spacing: 3px;
    margin-bottom: 10px;
}

.stat {
    margin: 5px 0;
    color: #b8d9ff;
}

#crosshair {
    position: fixed;
    left: 50%;
    top: 50%;
    width: 30px;
    height: 30px;
    transform: translate(-50%, -50%);
    border: 1px solid rgba(255,255,255,.7);
    border-radius: 50%;
    pointer-events: none;
}

#crosshair::before,
#crosshair::after {
    content: "";
    position: absolute;
    background: rgba(255,255,255,.8);
}

#crosshair::before {
    width: 44px;
    height: 1px;
    left: -8px;
    top: 14px;
}

#crosshair::after {
    height: 44px;
    width: 1px;
    top: -8px;
    left: 14px;
}

#message {
    position: fixed;
    bottom: 25px;
    left: 50%;
    transform: translateX(-50%);
    padding: 10px 18px;
    background: rgba(0,0,0,.65);
    border-radius: 8px;
    color: #9dccff;
    font-size: 14px;
}
</style>
</head>

<body>

<canvas id="game"></canvas>

<div id="hud">
    <h1>ORBITAL STRIKE</h1>
    <div class="stat">Корабль: <b>ORION-R</b></div>
    <div class="stat">Ракеты: <b id="missiles">30</b></div>
    <div class="stat">Дроны: <b id="drones">4</b></div>
    <div class="stat">Цели: <b id="targets">12</b></div>
    <div class="stat">Счёт: <b id="score">0</b></div>
</div>

<div id="crosshair"></div>

<div id="message">
    WASD — движение · ЛКМ — запуск ракеты · SPACE — запуск дрона
</div>

<script>

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

canvas.width = innerWidth;
canvas.height = innerHeight;

window.addEventListener("resize", () => {
    canvas.width = innerWidth;
    canvas.height = innerHeight;
});

/* =========================
   GAME VARIABLES
========================= */

let score = 0;
let missileCount = 30;
let droneCount = 4;

const keys = {};

document.addEventListener("keydown", e => {
    keys[e.key.toLowerCase()] = true;

    if (e.code === "Space") {
        launchDrone();
    }
});

document.addEventListener("keyup", e => {
    keys[e.key.toLowerCase()] = false;
});

/* =========================
   STARS
========================= */

const stars = [];

for (let i = 0; i < 450; i++) {

    stars.push({
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height,
        size: Math.random() * 2,
        speed: Math.random() * 0.7
    });

}

/* =========================
   PLAYER SHIP
========================= */

const player = {

    x: canvas.width / 2,
    y: canvas.height / 2,

    vx: 0,
    vy: 0,

    speed: 0.55,

    angle: 0

};

/* =========================
   MISSILES
========================= */

const missiles = [];

function launchMissile(targetX, targetY) {

    if (missileCount <= 0) return;

    missileCount--;

    const angle = Math.atan2(
        targetY - player.y,
        targetX - player.x
    );

    missiles.push({

        x: player.x,
        y: player.y,

        vx: Math.cos(angle) * 16,
        vy: Math.sin(angle) * 16,

        life: 100

    });

}

/* =========================
   MOUSE
========================= */

document.addEventListener("mousedown", e => {

    if (e.button === 0) {

        launchMissile(
            e.clientX,
            e.clientY
        );

    }

});

/* =========================
   DRONES
========================= */

const drones = [];

function launchDrone() {

    if (droneCount <= 0) return;

    droneCount--;

    drones.push({

        x: player.x,
        y: player.y,

        angle: Math.random() * Math.PI * 2,

        life: 900,

        orbit: Math.random() * 100 + 60

    });

}

/* =========================
   FICTIONAL TARGETS
========================= */

const targets = [];

for (let i = 0; i < 12; i++) {

    targets.push({

        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height,

        size: 30 + Math.random() * 25,

        health: 3,

        pulse: Math.random() * 10

    });

}

/* =========================
   EXPLOSIONS
========================= */

const explosions = [];

function explode(x, y) {

    explosions.push({

        x,
        y,

        radius: 5,

        alpha: 1

    });

}

/* =========================
   DRAW STARS
========================= */

function drawStars() {

    for (const star of stars) {

        ctx.fillStyle =
            `rgba(190,220,255,${0.4 + star.size / 3})`;

        ctx.beginPath();

        ctx.arc(
            star.x,
            star.y,
            star.size,
            0,
            Math.PI * 2
        );

        ctx.fill();

        star.y += star.speed;

        if (star.y > canvas.height) {
            star.y = 0;
            star.x = Math.random() * canvas.width;
        }

    }

}

/* =========================
   PLANET
========================= */

function drawPlanet() {

    const x = canvas.width * 0.78;
    const y = canvas.height * 0.72;
    const r = Math.min(canvas.width, canvas.height) * 0.23;

    const gradient =
        ctx.createRadialGradient(
            x - r * .3,
            y - r * .3,
            r * .1,
            x,
            y,
            r
        );

    gradient.addColorStop(0, "#486b91");
    gradient.addColorStop(.55, "#18344d");
    gradient.addColorStop(1, "#02050a");

    ctx.fillStyle = gradient;

    ctx.beginPath();

    ctx.arc(x, y, r, 0, Math.PI * 2);

    ctx.fill();

    /* atmosphere */

    ctx.strokeStyle = "rgba(90,180,255,.35)";
    ctx.lineWidth = 8;

    ctx.beginPath();

    ctx.arc(
        x,
        y,
        r + 4,
        0,
        Math.PI * 2
    );

    ctx.stroke();

}

/* =========================
   PLAYER SHIP
========================= */

function drawPlayer() {

    ctx.save();

    ctx.translate(player.x, player.y);

    ctx.rotate(player.angle);

    /* engine glow */

    const glow =
        ctx.createRadialGradient(
            -30,
            0,
            2,
            -30,
            0,
            35
        );

    glow.addColorStop(0, "white");
    glow.addColorStop(.3, "#69bfff");
    glow.addColorStop(1, "transparent");

    ctx.fillStyle = glow;

    ctx.beginPath();

    ctx.arc(-30, 0, 35, 0, Math.PI * 2);

    ctx.fill();

    /* main hull */

    ctx.fillStyle = "#9ba7b5";

    ctx.beginPath();

    ctx.moveTo(38, 0);
    ctx.lineTo(-20, -15);
    ctx.lineTo(-35, 0);
    ctx.lineTo(-20, 15);

    ctx.closePath();

    ctx.fill();

    /* cockpit */

    ctx.fillStyle = "#101d2d";

    ctx.beginPath();

    ctx.ellipse(
        10,
        0,
        14,
        7,
        0,
        0,
        Math.PI * 2
    );

    ctx.fill();

    /* wings */

    ctx.fillStyle = "#657384";

    ctx.beginPath();

    ctx.moveTo(-5, -10);
    ctx.lineTo(-28, -35);
    ctx.lineTo(-15, -5);

    ctx.closePath();

    ctx.fill();

    ctx.beginPath();

    ctx.moveTo(-5, 10);
    ctx.lineTo(-28, 35);
    ctx.lineTo(-15, 5);

    ctx.closePath();

    ctx.fill();

    /* Russian flag */

    const flagX = -2;
    const flagY = -22;

    ctx.fillStyle = "white";
    ctx.fillRect(flagX, flagY, 16, 3);

    ctx.fillStyle = "#2455b8";
    ctx.fillRect(flagX, flagY + 3, 16, 3);

    ctx.fillStyle = "#d52b2b";
    ctx.fillRect(flagX, flagY + 6, 16, 3);

    ctx.restore();

}

/* =========================
   MISSILES
========================= */

function drawMissiles() {

    for (const m of missiles) {

        const angle =
            Math.atan2(m.vy, m.vx);

        ctx.save();

        ctx.translate(m.x, m.y);
        ctx.rotate(angle);

        /* trail */

        const trail =
            ctx.createLinearGradient(
                -45, 0,
                0, 0
            );

        trail.addColorStop(0, "transparent");
        trail.addColorStop(.6, "#66c7ff");
        trail.addColorStop(1, "white");

        ctx.strokeStyle = trail;
        ctx.lineWidth = 4;

        ctx.beginPath();

        ctx.moveTo(-55, 0);
        ctx.lineTo(0, 0);

        ctx.stroke();

        /* missile */

        ctx.fillStyle = "#e5e9ed";

        ctx.beginPath();

        ctx.moveTo(14, 0);
        ctx.lineTo(-10, -4);
        ctx.lineTo(-16, 0);
        ctx.lineTo(-10, 4);

        ctx.closePath();

        ctx.fill();

        ctx.restore();

    }

}

/* =========================
   TARGETS
========================= */

function drawTargets() {

    for (const t of targets) {

        if (t.health <= 0) continue;

        t.pulse += .05;

        const glow =
            25 + Math.sin(t.pulse) * 5;

        ctx.shadowBlur = glow;
        ctx.shadowColor = "#ff3040";

        ctx.fillStyle = "#641b25";

        ctx.beginPath();

        ctx.arc(
            t.x,
            t.y,
            t.size,
            0,
            Math.PI * 2
        );

        ctx.fill();

        ctx.shadowBlur = 0;

        ctx.strokeStyle = "#ff5260";
        ctx.lineWidth = 2;

        ctx.beginPath();

        ctx.arc(
            t.x,
            t.y,
            t.size + 5,
            0,
            Math.PI * 2
        );

        ctx.stroke();

        /* antenna */

        ctx.strokeStyle = "#a9b2c0";

        ctx.beginPath();

        ctx.moveTo(t.x, t.y - t.size);
        ctx.lineTo(t.x, t.y - t.size - 20);

        ctx.stroke();

    }

}

/* =========================
   DRONES
========================= */

function drawDrones() {

    for (const d of drones) {

        d.angle += .03;

        const x =
            player.x +
            Math.cos(d.angle) * d.orbit;

        const y =
            player.y +
            Math.sin(d.angle) * d.orbit;

        ctx.fillStyle = "#b8c7d9";

        ctx.beginPath();

        ctx.moveTo(x + 12, y);
        ctx.lineTo(x - 10, y - 7);
        ctx.lineTo(x - 15, y);
        ctx.lineTo(x - 10, y + 7);

        ctx.closePath();

        ctx.fill();

        ctx.fillStyle = "#58bfff";

        ctx.beginPath();

        ctx.arc(x - 10, y, 4, 0, Math.PI * 2);

        ctx.fill();

        d.x = x;
        d.y = y;

        d.life--;

    }

}

/* =========================
   EXPLOSIONS
========================= */

function drawExplosions() {

    for (const e of explosions) {

        e.radius += 5;
        e.alpha -= .025;

        ctx.strokeStyle =
            `rgba(255,180,50,${e.alpha})`;

        ctx.lineWidth = 5;

        ctx.beginPath();

        ctx.arc(
            e.x,
            e.y,
            e.radius,
            0,
            Math.PI * 2
        );

        ctx.stroke();

        ctx.fillStyle =
            `rgba(255,90,20,${e.alpha * .25})`;

        ctx.beginPath();

        ctx.arc(
            e.x,
            e.y,
            e.radius * .6,
            0,
            Math.PI * 2
        );

        ctx.fill();

    }

}

/* =========================
   UPDATE
========================= */

function update() {

    /* movement */

    if (keys["w"]) player.vy -= player.speed;
    if (keys["s"]) player.vy += player.speed;
    if (keys["a"]) player.vx -= player.speed;
    if (keys["d"]) player.vx += player.speed;

    player.vx *= .94;
    player.vy *= .94;

    player.x += player.vx;
    player.y += player.vy;

    player.x = Math.max(50,
        Math.min(canvas.width - 50, player.x));

    player.y = Math.max(50,
        Math.min(canvas.height - 50, player.y));

    /* missiles */

    for (let i = missiles.length - 1; i >= 0; i--) {

        const m = missiles[i];

        m.x += m.vx;
        m.y += m.vy;

        m.life--;

        for (const t of targets) {

            if (t.health <= 0) continue;

            const dx = m.x - t.x;
            const dy = m.y - t.y;

            const distance =
                Math.sqrt(dx * dx + dy * dy);

            if (distance < t.size + 10) {

                t.health--;

                explode(t.x, t.y);

                missiles.splice(i, 1);

                score += 100;

                break;

            }

        }

        if (
            m.life <= 0 ||
            m.x < -100 ||
            m.x > canvas.width + 100 ||
            m.y < -100 ||
            m.y > canvas.height + 100
        ) {

            missiles.splice(i, 1);

        }

    }

    /* drones attack targets */

    for (const d of drones) {

        if (d.life <= 0) continue;

        for (const t of targets) {

            if (t.health <= 0) continue;

            const dx = d.x - t.x;
            const dy = d.y - t.y;

            if (
                Math.sqrt(dx * dx + dy * dy)
                < t.size + 25
            ) {

                t.health--;

                explode(t.x, t.y);

                score += 150;

            }

        }

    }

    /* player direction */

    player.angle =
        Math.atan2(
            mouseY - player.y,
            mouseX - player.x
        );

    /* remove dead drones */

    for (let i = drones.length - 1; i >= 0; i--) {

        if (drones[i].life <= 0) {
            drones.splice(i, 1);
        }

    }

    /* remove old explosions */

    for (let i = explosions.length - 1; i >= 0; i--) {

        if (explosions[i].alpha <= 0) {
            explosions.splice(i, 1);
        }

    }

}

/* =========================
   MOUSE POSITION
========================= */

let mouseX = canvas.width / 2;
let mouseY = canvas.height / 2;

document.addEventListener("mousemove", e => {

    mouseX = e.clientX;
    mouseY = e.clientY;

});

/* =========================
   HUD
========================= */

function updateHUD() {

    document.getElementById("missiles").textContent =
        missileCount;

    document.getElementById("drones").textContent =
        droneCount;

    document.getElementById("targets").textContent =
        targets.filter(t => t.health > 0).length;

    document.getElementById("score").textContent =
        score;

}

/* =========================
   GAME LOOP
========================= */

function gameLoop() {

    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );

    drawStars();

    drawPlanet();

    drawTargets();

    drawDrones();

    drawMissiles();

    drawExplosions();

    drawPlayer();

    update();

    updateHUD();

    requestAnimationFrame(gameLoop);

}

gameLoop();

</script>

</body>
</html>
